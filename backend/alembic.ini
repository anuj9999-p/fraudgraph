[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is set in alembic/env.py from FG_DATABASE_URL (see .env.example)
[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
